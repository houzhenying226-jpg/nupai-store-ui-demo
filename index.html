nsaction:''},'收钱吧':{amount:state.outOfBounds?'2980':'5980',transaction:''},'现金':{amount:'1000',transaction:''}};state.approved=false;break;case 'payment-view':if(['customer','staff'].includes(data.value))state.paymentView=data.value;break;case 'approve':if(state.paymentView==='staff')state.approved=true;break;case 'settle':if(!paymentIssue()){bindFromOrder();state.total=paymentTotal();state.contractAmount=state.total;state.paid=true;state.signed=false;go(8);}break;case 'pay-later':state.payments={'团购验券':{amount:'1',transaction:''},'收钱吧':{amount:'5980',transaction:''},'现金':{amount:'1000',transaction:''}};state.outOfBounds=false;state.approved=false;go(6);break;case 'sign':if(!mainAction(8).issue)state.signed=true;break;case 'edit-contract':state.signed=false;state.modal='edit-contract';break;case 'mismatch':state.contractAmount=state.contractAmount===state.total?state.total+1:state.total;break;case 'half':if(!state.submitted)state.order.half=data.value==='true';break;case 'order-gender':state.order.gender=data.value;break;case 'start-measure-items':if(!orderInfoIssue()){bindFromOrder();state.measureStage='items';state.index=0;}break;case 'back-order-info':state.measureStage='order';break;case 'pattern':item.pattern=data.value;if(data.value!=='other')item.patternCustom='';break;case 'add-row':ensureRows(item).push({part:'',net:'',finished:'',correction:'',custom:true});break;case 'del-row':ensureRows(item).splice(Number(data.index),1);break;case 'sync-rows':{ensureRows(item);const targets=state.items.filter(s=>s!==item&&s.garmentType===item.garmentType);const conflicts=targets.map(s=>({name:itemName(s),n:ensureRows(s).filter((r,k)=>(r.net||r.finished||r.correction)&&item.rows[k]&&(item.rows[k].net||item.rows[k].finished||item.rows[k].correction)).length})).filter(x=>x.n);if(conflicts.length&&!data.confirmed){state.modal='sync-confirm';state.syncConflicts=conflicts;break;}state.syncUndo=targets.map(s=>({id:s.clientItemId,rows:clone(s.rows),pattern:s.pattern,patternCustom:s.patternCustom}));for(const s of targets){ensureRows(s);item.rows.forEach((r,k)=>{if(!s.rows[k])s.rows[k]={part:r.part,net:'',finished:'',correction:'',custom:r.custom};['net','finished','correction'].forEach(key=>{if(r[key]!=='')s.rows[k][key]=r[key];});if(r.custom&&r.part)s.rows[k].part=r.part;});if(item.pattern){s.pattern=item.pattern;s.patternCustom=item.patternCustom;}}state.modal=null;state.notice=`已把${itemName(item)}的尺寸同步到 ${targets.map(itemName).join('、')}（只写入本件已填的格；备注不同步）。`;break;}case 'undo-sync':if(state.syncUndo){for(const u of state.syncUndo){const s=state.items.find(x=>x.clientItemId===u.id);if(s){s.rows=u.rows;s.pattern=u.pattern;s.patternCustom=u.patternCustom;}}state.syncUndo=null;state.notice='已撤销同步。';}break;case 'sample-attach':state.order.attachments.push('示例附件'+(state.order.attachments.length+1));break;case 'measure-example':if(!state.submitted){ensureRows(item).forEach(r=>{if(!r.custom){r.net=r.part.includes('围')?'96':'76';r.finished=String(Number(r.net)+4);}});if(['suit_jacket','trousers','casual_pants'].includes(item.garmentType)&&!item.pattern)item.pattern='CY';}break;case 'finish-measure':if(!mainAction(9).issue){state.measured=true;state.notice=`量体已保存，共 ${state.items.length} 件。${state.paid?'回本单核对。':'去收款。'}`;go(state.paid?6:7);}break;case 'draft-measure':go(6);break;case 'submit':if(!mainAction(6).issue&&cartStatus()==='measured'){state.submitted=true;state.notice='本单已提交生产。订单 STO-DEMO-0919 已生成，件级方案与量体已锁定。';go(6);}break;case 'order':state.modal='order';break;case 'jump':{const why=mainAction().issue;if(why){if(why.index!==undefined){state.index=why.index;state.editReturn=state.screen;}go(why.screen??4);state.focus=why.field;if(state.screen===1){state.date='今日';state.page=1;state.apSearch='';state.appointmentStatus='已确认';}}break;}case 'date':state.date=data.value;state.page=1;break;case 'page':state.page=Math.max(1,state.page+Number(data.delta));break;case 'clear-search':state.search='';break;case 'confirm-appt':state.appointmentStatus='已确认';break;case 'cancel-appt':state.appointmentStatus='已取消';break;case 'new-appt':state.date='今日';state.appointmentStatus='已确认';state.page=1;state.apSearch='';break;case 'invite':state.modal='invite';break;case 'member':state.modal='member';break;case 'activate-wallet':state.walletActive=true;state.modal=null;break;case 'upload-fail':state.uploadFail=!state.uploadFail;break;case 'sample-photo':if(!state.submitted){if(state.uploadFail)state.notice='图片添加失败，可重试；尺寸仍可保存。';else {item.photos.push({name:'本件面料示例',purpose:'面料',src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" fill="#23304d"/><path d="M0 30H160M0 60H160M0 90H160M0 120H160M30 0V160M60 0V160M90 0V160M120 0V160" stroke="#4a5570"/><text x="80" y="84" text-anchor="middle" fill="white" font-size="17">0038</text></svg>')});state.notice='本件图片已保存在当前 Demo。';}}break;case 'pdf':state.modal='pdf';break;case 'legacy':if(state.items[0]?.legacyDetails)state.modal='legacy';break;case 'reception-entry':state.modal=data.value;break;}}

function fiveQuestions(){const count=state.items.length,n=state.index+1,configured=state.items.filter(i=>i.configured&&!issue(i)).length,customer=state.customer?.name||'未预约客户 · 未登记';let identity=`${customer} · ${state.saved?'本单 STO-DEMO-0919':'接待草稿 RC-0919-01'}`,saved='暂无接待记录',missing='选择接待入口',next=mainAction().label,back='客户首页 · 未完成接待';switch(state.screen){case 0:identity='国贸店 · 顾问小周 · 今日接待';saved=state.saved?'本单已保存':'今日 14:00 预约';missing=state.saved?statusLabel():'待开始接待';next=state.story==='B'?'未预约 · 直接开始':'已预约 · 看今日台账';back='客户 Tab 首页';break;case 1:identity='王先生（姓名待补）· 今日 14:00 · 预约';saved='预约已确认 · 手机尾号 8866';missing='到店需求沟通';next='开始接待';back='客户首页 → 已预约';break;case 2:saved=state.needsSaved?'需求沟通已保存 ✓':'需求正在记录';missing=state.needsSaved?'选择款式':'至少记录一项';break;case 3:case 4:case 5:identity+=` · ${count?`第 ${n}/${count} 件`:'待选品类'}`;saved=`需求已存 · 已配置 ${configured} 件`;missing=firstIssue()?.label||`${state.items.reduce((n,i)=>n+tbdCount(i),0)} 项待定（可保存）`;break;case 6:identity+=` · ${count} 件`;saved=`方案已保存 · ${statusLabel()}`;missing=state.submitted?'已完成门店下单':mainAction().issue?.label||(!state.paid?'付款':!state.signed?'签署':!state.measured?'量体':'核对提交');back='首页未完成接待 / 客户卡片「本单」';break;case 7:saved='方案已保存';missing='收款确认';next='确认结算，去签合同';back='购物车 · 本单';break;case 8:identity+=` · 合同金额 ¥${state.contractAmount.toLocaleString('zh-CN')}`;saved=state.paid?'已收款 ✓':'尚未收款';missing=state.signed?(state.measured?'签署已完成':'签署已完成 · 尚未量体'):'客户签署';back=state.signed&&!state.measured?'进入量体（本单尚未量体，勿提交生产）':'购物车 · 本单';break;case 9:identity+=state.measureStage==='order'?' · 订单信息':` · 第 ${n}/${count} 件`;saved=`${state.paid?'已付款':'未付款'} · ${state.measureStage==='order'?'订单信息填写中':'已量 '+state.items.filter(i=>!itemMeasureMissing(i).length).length+' 件'}`;missing=state.submitted?'已发工厂，补图请联系跟单':measureIssue()?.label||'图片可在提交生产前稍后补';back=state.submitted?'购物车 · 本单':'购物车 · 本单 / 首页待办';}

function renderAppointments(){const exists=state.date==='今日'&&state.page===1&&appointmentMatches();return `<section class="card" id="appointment-tools"><h3>预约台账 ${mark('C-APPT-FIND')}</h3><div class="date-tools">${['昨日','今日','明日'].map(d=>b(d,'date','',`data-value="${d}" class="${state.date===d?'chip selected':''}"`)).join('')}</div><label class="muted">自选日期<input type="date" data-input="date" aria-label="自选日期"></label><div style="margin-top:10px">${fieldInput('',state.apSearch,'appointment-search','','','姓名 / 手机号')}</div></section>${exists?`<section class="card"><div class="row"><span class="title-num">14:00</span><span class="pill">${E(state.appointmentStatus)}</span></div><h2 style="margin-top:10px">王先生<span class="muted">（姓名待补）</span></h2><p class="muted">今日预约 · 手机尾号 8866</p>${mark('C-APPT-ROW')}<details class="more"><summary>⋯ 更多</summary>${state.appointmentStatus!=='已到店'?b('确认','confirm-appt'):''}${b('取消','cancel-appt')}${b('邀请链接','invite')}${b('新建预约','new-appt')}</details></section>`:`<div class="card empty">${state.apSearch?'没有符合条件的预约':'今日暂无预约'}<p>切换日期或修改搜索条件继续</p>${b('回今日预约','new-appt')}</div>`}<div class="row">${b('上一页','page','','data-delta="-1"')}<small>第 ${state.page} 页 · 每页 50 条</small>${b('下一页','page','','data-delta="1"')}</div>`;}
function renderNeeds(){return `<section class="card" id="needs-scene"><div class="section-label"><h3>穿着场景 <small>可多选</small></h3>${mark('C-NEED-SCENE')}</div>${[['商务',['商务休闲','商务正装']],['婚礼',['室内婚礼','室外婚礼']]].map(([label,opts])=>`<p class="muted" style="margin:12px 0 7px">${label}</p><div class="chips">${opts.map(v=>b(v,'scene','',`class="chip ${state.needs.scenes.includes(v)?'selected':''}" data-value="${v}" aria-pressed="${state.needs.scenes.includes(v)}"`)).join('')}</div>`).join('')}${state.legacy?'<p class="muted">历史：正式商务（只读）</p>':''}</section><section class="card"><div class="section-label"><h3>心理预算</h3>${mark('C-NEED-BUDGET')}</div><div class="chips">${['5 千以内','5 千–1 万','1 万–3 万','3 万–5 万','5 万以上','不确定'].map(v=>b(v,'budget','',`class="chip ${state.needs.budget===v?'selected':''}" data-value="${v}"`)).join('')}</div></section><section class="card"><div class="section-label"><h3>客户特殊要求 / 备注</h3>${mark('C-NEED-REMARK')}</div><textarea data-input="need-remark" aria-label="客户特殊要求 / 备注" placeholder="记下客户特别在意的事，可留空">${E(state.needs.remark)}</textarea></section>`;}
function renderCategories(){const cats=['bundle2','bundle3',...(state.gender==='女'?['womenswear']:[]),'suit_jacket','trousers','vest','shirt','casual_pants','overcoat','jacket','windbreaker','polo'];return wizardSteps()+`<section class="card" id="gender"><div class="section-label"><h3>先选择定制方向</h3>${mark('A-CAT-01')}</div><div class="grid">${['男','女'].map(g=>b(g+'装定制','gender','',`data-value="${g}" class="chip ${state.gender===g?'selected':''}"`)).join('')}</div></section>${!state.gender?'<div class="empty">先选男装或女装，再选品类</div>':`<section class="card" id="category-list"><div class="section-label"><h3>选品类</h3>${mark(state.gender==='男'?'C-CAT-LIST-M':'C-CAT-LIST-F')}</div><div class="grid category-grid">${cats.map(c=>`<div><button class="full ${state.selection[c]?'chip selected':''}" data-action="category" data-value="${c}">${NAMES[c]}${c.startsWith('bundle')?`<small class="sub">${c==='bundle3'?'上衣 / 西裤 / 马甲':'上衣 / 西裤'}</small>`:''}</button>${state.selection[c]?`<div class="count">${b('−','qty','',`data-value="${c}" data-delta="-1" aria-label="减少${NAMES[c]}"`)}<span>${state.selection[c]} ${c.startsWith('bundle')?'套':'件'}</span>${b('＋','qty','',`data-value="${c}" data-delta="1" aria-label="增加${NAMES[c]}"`)}</div>`:''}</div>`).join('')}</div>${marks(['C-CAT-QTY'])}</section>`}<section class="card selected-list"><div class="section-label"><h3>已选 ${state.items.length} 件</h3>${mark('C-CAT-SELECTED')}</div>${state.items.length?state.items.map((i,n)=>`<div class="row"><span>${n+1}. ${itemName(i)}${i.bundleId?' <small>套装成员</small>':''}</span>${b('删除','remove-item','',`class="link" data-index="${n}" aria-label="删除第${n+1}件"`)}</div>`).join(''):'<p class="muted">选中的品类会逐件列在这里</p>'}${marks(['C-WIZ-ITEMS'])}</section>`;}
function tabs(){return `<div class="tabs" aria-label="按件切换">${state.items.map((i,n)=>b(`${n+1}. ${itemName(i)} ${issue(i)?'●':tbdCount(i)?'⚠ '+tbdCount(i):i.configured?'✓':'●'}`,'tab','',`data-index="${n}" class="${state.index===n?'active':''}" aria-current="${state.index===n}"`)).join('')}</div>${state.screen===4?marks(['A-TAB-01']):''}`;}
function renderFabric(i){const q=i.query.trim().toUpperCase();let matches=q.length>=2?FABRICS.filter(f=>f.fabric_code.toUpperCase().startsWith(q)).slice(0,10):[];if(state.noMatch&&i.query==='0038')matches=[];return `<section class="card" id="field-fabric"><div class="section-label"><h3>本件面料</h3>${mark('A-FAB-01')}</div>${i.fabric?`<div class="fabric-card"><div class="row"><strong>${E(i.fabric.fabric_code)}</strong>${b('修改本件面料','edit-fabric','A-FAB-02','class="link"')}</div><div>${E(i.fabric.brand)} · ${E(i.fabric.name)}</div><small>${i.fabricMode==='synced'?'已从西装上衣同步':i.fabricMode==='manual'?'已单独修改':'本件独立选择'}</small>${marks(['C-FAB-SYNC'])}</div>`:`<label><span class="muted">输入供应商面料号，输 2 位即实时匹配（如 00）</span><input data-input="fabric-query" id="fabric-query" value="${E(i.query)}" placeholder="${i.garmentType==='shirt'?(state.index===4?'SH-27':'SH-11'):i.garmentType==='womenswear'?'DR-08':'0038'}" autocomplete="off"></label><div id="fabric-results">${mark('C-FAB-RESULT')}${i.query?(matches.length?`${matches.length>1?'<p class="help">匹配到多个面料/品牌，请点选一个。</p>':''}${matches.map(f=>b(`${E(f.fabric_code)} · ${E(f.brand)} · ${E(f.name)}`,'fabric','',`class="fabric-result" data-value="${f.id}"`)).join('')}`:`<p class="error-box" style="margin-top:10px">没有 ${E(i.query)}，检查编号或换一个</p>${b('重新输入编号','edit-fabric')}`):'<p class="muted">试用：输「00」看 0037/0038；SH、DR 同理</p>'}</div>`}</section>`;}
function renderGroup(g,i){if(g.input==='text')return `<div class="group" id="field-${g.field}"><div class="section-label"><h3>${g.label} <small>可空</small></h3>${mark(g.id)}</div>${fieldInput('',i.craft[g.field],'craft-text',g.field,'','输入编号')}</div>`;const v=i.craft[g.field];return `<div class="group" id="field-${g.field}" data-craft-field="${g.field}"><div class="section-label"><h3>${g.label}${g.multi?' <small>内袋可多选</small>':''}</h3>${mark(g.id)}</div><div class="chips">${g.options.map(o=>b(E(o),'craft','',`class="chip ${(Array.isArray(v)?v.includes(o):v===o)?'selected':''}" data-field="${g.field}" data-value="${E(o)}" ${g.field==='sleeve'&&o==='叠扣'?'data-cue="sleeve-resolve"':''}`)).join('')}${b(v==='other'&&i.craftVersion===2?`其他：${E(i.notes[g.field]||'未填写')}`:'其他手填','craft','',`class="chip ${v==='other'?'selected':''}" data-field="${g.field}" data-value="other"`)}${b('待定','craft','',`class="chip tbd ${v==='tbd'?'selected':''}" data-field="${g.field}" data-value="tbd"`)}</div>${marks(['A-CRAFT-OPT','A-CRAFT-OTHER','A-CRAFT-TBD'])}${v==='other'?fieldInput(g.other_prompt||'请填写本项说明（必填）',i.notes[g.field]||'','craft-note',g.field,'',g.field==='button'||g.field==='back_lining'?'手填编号':g.other_prompt?'色号':'输入具体要求'):''}${g.field==='collar'&&i.garmentType==='shirt'&&g.options.includes(v)?fieldInput('领尖长度（cm）',i.collarLen,'collar-len','','','例如 7.5','number')+mark('C-SHT-COLLARLEN'):''}${v==='tbd'?'<p class="help">可先保存、付款与量体，提交生产前需落定。</p>':''}${g.field==='hem'&&v==='外翻'?fieldInput('外翻宽度（cm）',i.hemCm,'hem-cm','','','4.5','number'):''}${g.field==='emb_pos'&&g.options.includes(v)?`<p class="help">${v==='左袖头面'?'距底边 1 厘米，从左 1/3 处':'上下左右居中'}</p>`:''}</div>`;}
function renderCrafts(i){const order={suit_jacket:'C-CAT-JKT-ORDER',vest:'C-CAT-VST-ORDER',shirt:'C-CAT-SHT-ORDER'};return `<section class="card"><div class="section-label"><h3>逐项工艺</h3>${mark('C-CRAFT-GROUPS')}</div>${marks([order[i.garmentType]])}${CATALOG[i.garmentType].map(g=>renderGroup(g,i)).join('')}${['suit_jacket','shirt'].includes(i.garmentType)?`<div class="group" id="field-emb"><div class="section-label"><h3>刺绣 <small>三项全空为无</small></h3>${mark('C-CRAFT-EMB')}</div><div class="stack">${fieldInput('内容',i.emb.content,'emb','content','','可写「见图片」')}${fieldInput('字体（编号）',i.emb.font,'emb','font')}${fieldInput('颜色（编号）',i.emb.color,'emb','color')}${i.garmentType==='suit_jacket'?`${mark('C-JKT-EMBNOTE')}${fieldInput('补充刺绣要求',i.emb.note,'emb','note')}`:''}</div></div>`:''}<div class="group"><div class="section-label"><h3>本件补充工艺要求</h3>${mark('C-CRAFT-REMARK')}</div><textarea data-input="item-remark" aria-label="本件补充工艺要求" placeholder="仅记在${itemName(i)}这件上，可空">${E(i.remark)}</textarea></div></section>`;}
function renderItems(){const i=currentItem();if(!i)return wizardSteps()+'<div class="card empty">还没选品类，请先回到选品类</div>';return wizardSteps()+tabs()+`<p class="muted" style="margin-bottom:12px">第 ${state.index+1} 件 · ${itemName(i)} ${mark('C-TAB-ITEM')}</p>`+renderFabric(i)+renderCrafts(i);}
function craftValue(i,g){const v=i.craft[g.field];return v==='tbd'?'<span class="tbd-text">待定</span>':v==='other'?`其他：${E(i.notes[g.field]||'未填写')}`:E(Array.isArray(v)?v.join('、'):v||'—');}
function itemSummary(i,n,editable=true){return `<article class="card review-card" id="review-${n}" data-review-index="${n}"><div class="row"><div><span class="title-num">${n+1<10?'0':''}${n+1}</span><strong>${itemName(i)}</strong></div>${editable?b('修改本件','edit-item','A-CONF-01',`data-index="${n}" class="link"`):''}</div><p class="muted" style="margin-top:7px">${i.bundleId?'三件套 / 两件套成员 · ':''}${i.fabric?`${E(i.fabric.fabric_code)} · ${E(i.fabric.brand)} · ${E(i.fabric.name)}`:'尚未选面料'}</p>${i.legacyDetails?`<div class="banner" style="margin-top:12px"><strong>历史方案 · 只读原文</strong>${i.legacyDetails.craftLabels.map(x=>`<p>${E(x)}</p>`).join('')}<small>旧版记录按原标签回显，保留已有内容。</small>${b('查看原始记录','legacy','','class="link"')}</div>`:''}<dl>${CATALOG[i.garmentType].map(g=>`<div class="summary-row"><dt>${g.label}</dt><dd>${craftValue(i,g)}${g.field==='hem'&&i.craft.hem==='外翻'?` · ${E(i.hemCm)} cm`:''}</dd></div>`).join('')}${['suit_jacket','shirt'].includes(i.garmentType)?`<div class="summary-row"><dt>刺绣</dt><dd>${E(i.emb.content||'无')} ${E(i.emb.font)} ${E(i.emb.color)}${i.emb.note?' · '+E(i.emb.note):''}</dd></div>`:''}<div class="summary-row"><dt>补充要求</dt><dd>${E(i.remark||'无')}</dd></div></dl>${mark('C-CONF-CARD')}</article>`;}
function renderReview(){return wizardSteps()+`<div class="row" style="margin-bottom:12px"><p class="muted">逐件核对 · 共 ${state.items.length} 件</p>${mark('C-CONF-SCROLL')}</div>${state.legacy?'<p class="banner">历史需求：正式商务（只读回显）</p>':''}${state.items.map((i,n)=>itemSummary(i,n)).join('')}<div class="progress" aria-label="核对进度"><span id="review-progress">1</span>/${state.items.length}</div>`;}
function renderCart(){return `${state.paid&&!state.submitted?`<div class="banner">${PAID_CART_NOTICE}${mark('C-CART-BANNER')}</div>`:state.notice?`<div class="banner">${E(state.notice)}${mark('C-CART-BANNER')}</div>`:`<p class="muted">保存后可先付款，也可以先量体。 ${mark('C-CART-BANNER')}</p>`}<section class="card" id="order-summary"><div class="section-label"><h3>本单 ${state.items.length} 件</h3>${mark('C-CART-ITEMS')}</div>${state.items.map((i,n)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #f0eee8"><div><strong>${n+1}. ${itemName(i)}</strong><p class="muted">${i.fabric?`${i.fabric.fabric_code} · ${i.fabric.brand}`:'未选面料'} · <span class="${tbdCount(i)?'tbd-text':''}">${tbdCount(i)?'⚠ '+tbdCount(i)+' 项待定':'工艺已齐'}</span></p></div>${!state.submitted?b('修改','edit-item','',`data-index="${n}" class="link"`):'<span class="pill">已锁定</span>'}</div>`).join('')}<details class="more"><summary>⋯ 更多</summary>${state.history.length?b('历史方案','history','A-CART-04'):''}${b('返回客户','home')}</details></section><div class="row"><small>状态：${statusLabel()}</small>${mark('C-CART-STATE')}</div>`;}
const METHODS=['微信','支付宝','银行卡','现金','银行转账','转账','收钱吧','团购验券','会员钱包'];
function renderPayment(){const total=paymentTotal(),overflow=total>6981||total<6981*.7,staff=state.paymentView==='staff',needBasic=!state.customer||state.customer.nameComplete===false;return `${state.notice&&/量体已保存/.test(state.notice)?`<p class="success-box">${E(state.notice)}</p>`:''}${needBasic?`<section class="card" id="field-pay-basic"><div class="section-label"><h3>客户基本信息 <small>结算前必填</small></h3>${mark('A-BIND-01')}</div><p class="muted" style="margin-bottom:8px">接待会话 ${E(state.sessionId)} · ${state.customer?`已绑定客户 ${E(state.customer.id)}`:'未绑定客户（结算时绑定）'}</p><div class="stack">${fieldInput('顾客姓名',state.order.name,'order','name','','客户姓名')}${state.customer?'':fieldInput('手机号',state.order.phone,'order','phone','','11 位手机号','tel')}</div></section>`:''}<div class="tabs" aria-label="付款屏幕切换">${[['customer','客户屏'],['staff','店员屏']].map(([value,label])=>b(label,'payment-view','',`data-value="${value}" aria-pressed="${state.paymentView===value}" class="${state.paymentView===value?'active':''}"`)).join('')}</div><section class="card" id="methods"><div class="section-label"><h3>支付方式 <small>可组合</small></h3>${mark('A-PAY-01')}</div><div class="chips">${METHODS.filter(m=>m!=='会员钱包'||state.walletActive).map(m=>b(m,'pay-method','',`class="chip ${state.payments[m]?'selected':''}" data-value="${m}"`)).join('')}</div><p class="muted">会员钱包 ${b('开卡 / 充值','member','','class="link"')}</p></section>${Object.entries(state.payments).map(([m,p])=>`<section class="card" id="field-pay-${m}"><div class="section-label"><h3>${m}</h3>${mark('A-PAY-02')}</div><div class="stack">${fieldInput('本方式金额',p.amount,'payment',m,'','','number')}</div>${m==='会员钱包'?'<p class="muted">金额须在本账户可用额度内。</p>':''}</section>`).join('')}<section class="card"><div class="row"><h3>实付合计</h3>${mark('C-PAY-TOTAL')}</div><p class="bill">¥${total.toLocaleString('zh-CN',{maximumFractionDigits:2})}</p><p class="muted">所选渠道合并为一笔结算</p>${staff?`<div style="margin-top:14px"><label class="switch-row"><input type="checkbox" data-action="overflow" ${state.outOfBounds?'checked':''}>模拟越界（店员屏）</label></div>`:''}${staff&&overflow?`<div class="error-box" id="field-approval" style="margin-top:12px"><strong>店员屏 · 应收 6981 元（含优惠），请核对</strong><p>${total>6981?'超过应收上限，请返回渠道行调整。':state.approved?'店长已审批（Demo），可以继续结算。':'当前组合低于审批线，需要店长审批。'}</p>${total<=6981&&!state.approved?b('模拟店长审批通过','approve','','class="full"'):''}</div>`:''}</section><details class="more"><summary>⋯ 更多</summary>${b('稍后再付（保存并回本单）','pay-later','A-PAY-04')}${b('开卡并继续 / 先充值','member')}</details>`;}
function renderContract(){return `<section class="card" id="contract"><div class="row"><h3>合同金额</h3>${mark('C-CTR-AMOUNT')}</div><p class="bill">¥${state.contractAmount.toLocaleString('zh-CN')}</p><p class="muted">与本单结算实付合计一致 · 只读</p>${state.contractAmount!==state.total?'<p class="error-box">返回付款页重新确认</p>':''}</section><section class="card"><p class="eyebrow">NUPAI · 定制服装委托书</p><h2>${E(state.customer?.name||'客户未登记')}</h2><p class="muted" style="margin-top:8px">本单 STO-DEMO-0919 · 共 ${state.items.length} 件</p><p style="margin-top:16px;font-size:13px">客户已核对每件的面料、款式与工艺。待定项将在提交生产前逐项确认，图片可在量体时补充。</p><div style="margin-top:14px">${state.items.map((i,n)=>`<p class="muted">${n+1}. ${itemName(i)} · ${i.fabric?.fabric_code||'未选'}${tbdCount(i)?' · 有待定项':''}</p>`).join('')}</div>${state.signed?`<div class="signature">${E(state.customer?.name.replace('（姓名待补）','')||'客户')}</div><p class="success-box">✓ 客户签署完成（Demo 签名）</p>`:'<div class="empty">请客户核对后，点下方「客户签署」<br><small>本 Demo 点击后生成示例签名</small></div>'}<details class="more"><summary>⋯ 更多</summary>${b('查看 / 下载 / 发送 PDF','pdf')}${!state.submitted?b('编辑合同（需重签）','edit-contract')+b('返回修改','to-payment')+b('模拟金额不一致','mismatch'):''}${b('查看订单','order')}</details></section>`;}
function renderMeasure(){if(!state.items.length)return '<div class="card empty">本单还没有件，请先选品类</div>';if(state.measureStage==='order'){const o=state.order,anon=!state.customer,needName=anon||state.customer.nameComplete===false;return `<section class="card" id="field-meas-basic"><div class="section-label"><h3>① 客户基本信息</h3>${mark('C-MEAS-BASIC')}</div><p class="muted" style="margin-bottom:8px">接待会话 ${E(state.sessionId)} · ${state.customer?`已绑定客户 ${E(state.customer.id)}`:'未绑定客户（保存后自动绑定）'}</p><div class="stack">${needName?fieldInput('顾客姓名',o.name,'order','name','','客户姓名')+mark('A-BIND-01'):`<p><strong>${E(state.customer.name)}</strong> <small>手机尾号 ${E(state.customer.phone.slice(-4))}</small></p>`}${anon?fieldInput('手机号',o.phone,'order','phone','','11 位手机号','tel'):''}<div><span class="muted">性别 <small>必选</small></span><div class="chips" style="margin-top:6px">${['男','女'].map(g=>b(g,'order-gender','',`data-value="${g}" class="chip ${o.gender===g?'selected':''}"`)).join('')}</div></div><div class="grid">${fieldInput('身高（cm）必填',o.height,'order','height','','','number')}${fieldInput('体重（kg）必填',o.weight,'order','weight','','','number')}</div><div><span class="muted">是否半成品试衣 <small>必选</small></span><div class="chips" style="margin-top:6px">${[['是',true],['否',false]].map(([l,v])=>b(l,'half','',`data-value="${v}" class="chip ${o.half===v?'selected':''}" ${state.submitted?'disabled':''}`)).join('')}</div>${mark('A-MEAS-02')}<small>整单只选一次；提交生产后只读</small></div></div></section><section class="card" id="field-meas-dates"><div class="section-label"><h3>② 日期 <small>都可暂不填</small></h3>${mark('C-MEAS-DATES')}</div><div class="stack">${fieldInput('订单日期（默认今天，可改）',o.orderDate,'order','orderDate','','','date')}${fieldInput('试样日期',o.fittingDate,'order','fittingDate','','','date')}${fieldInput('交货日期',o.deliveryDate,'order','deliveryDate','','','date')}</div></section><section class="card" id="field-meas-attach"><div class="section-label"><h3>③ 整单附件</h3>${mark('A-MEAS-ATTACH')}</div><p class="muted">请上传：纸质量体单、体型照片、手绘草图、订单合同（可一次选多张）</p>${state.submitted?'<p class="muted">已发工厂，补传请联系跟单</p>':`<input type="file" accept="image/*,.pdf" multiple data-upload="order" aria-label="整单附件"><div>${b('添加示例附件','sample-attach','','class="link"')}</div>`}<p class="muted">已添加 ${o.attachments.length} 份${o.attachments.length?'：'+o.attachments.map(E).join('、'):''}</p></section><section class="card"><div class="section-label"><h3>④ 整单备注</h3>${mark('C-MEAS-ORDER-REMARK')}</div><textarea data-input="order" data-field="remark" aria-label="整单备注" placeholder="整单层面的备注，可空">${E(o.remark)}</textarea></section>`;}
const i=currentItem();ensureRows(i);const peers=state.items.filter(x=>x!==i&&x.garmentType===i.garmentType);const needPattern=['suit_jacket','trousers','casual_pants'].includes(i.garmentType);const dis=state.submitted?'disabled':'';const legacyPattern=i.pattern&&!['CY','YN','other'].includes(i.pattern);if(legacyPattern){i.patternCustom=i.pattern;i.pattern='other';}return tabs()+`${state.notice&&/同步/.test(state.notice)?`<p class="success-box">${E(state.notice)}</p>`:''}<p class="muted" style="margin-bottom:12px">第 ${state.index+1} 件 · ${itemName(i)} ${mark('C-MEAS-HEADER')}</p><section class="card" id="field-photos"><div class="section-label"><h3>① 本件图片</h3>${mark('A-MEAS-01')}</div><p class="muted">请上传：面料、款式、刺绣相关图片（可一次选多张）· 只附在${itemName(i)}上</p>${state.submitted?'<p class="muted">已发工厂，补图请联系跟单</p>':`<input type="file" accept="image/*" multiple data-upload="item" aria-label="本件图片"><div>${b('添加本件示例图片','sample-photo','','class="link"')}</div>`}<div class="photos">${i.photos.map(p=>`<div><img src="${E(p.src)}" alt="${E(p.name)}"></div>`).join('')}</div><p class="muted">${state.submitted?'':i.photos.length?'本件图片已保存':'可稍后补（提交生产前）· 已列入首页待办'}</p>${mark('C-MEAS-UPLOAD-OPT')}${!state.submitted&&state.notice.includes('图片')?`<p class="${state.uploadFail?'error-box':'success-box'}">${E(state.notice)}</p>`:''}${!state.submitted?`<label class="switch-row" style="margin-top:12px"><input type="checkbox" data-action="upload-fail" ${state.uploadFail?'checked':''}>模拟上传失败</label>`:''}</section><section class="card" id="field-table"><div class="section-label"><h3>② 本件尺寸</h3>${mark('C-MEAS-TABLE')}</div>${needPattern?`<div class="group" id="field-pattern"><div class="section-label"><h3>版型</h3>${mark('C-MEAS-PATTERN')}</div><div class="chips">${['CY','YN'].map(p=>b(p,'pattern','',`data-value="${p}" class="chip ${i.pattern===p?'selected':''}" ${dis}`)).join('')}${b('自定义手填','pattern','',`data-value="other" class="chip ${i.pattern==='other'?'selected':''}" ${dis}`)}</div>${i.pattern==='other'?fieldInput('请填写版型',i.patternCustom,'pattern-custom','','','例如 8A1P'):''}</div>`:''}<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px"><thead><tr><th style="text-align:left;padding:6px 4px">部位</th><th style="padding:6px 4px">净尺寸</th><th style="padding:6px 4px">成衣尺寸</th><th style="padding:6px 4px">修正</th></tr></thead><tbody>${i.rows.map((r,idx)=>`<tr><td style="padding:4px;min-width:82px">${r.custom?`<input data-input="row" data-field="${idx}:part" value="${E(r.part)}" placeholder="部位名" aria-label="自定义部位" ${dis}>`:`${idx+1} ${E(r.part)}`}</td><td style="padding:4px"><input type="number" min="0" step="0.1" inputmode="decimal" data-input="row" data-field="${idx}:net" value="${E(r.net)}" aria-label="${E(r.part)}净尺寸" ${dis}></td><td style="padding:4px"><input type="number" min="0" step="0.1" inputmode="decimal" data-input="row" data-field="${idx}:finished" value="${E(r.finished)}" aria-label="${E(r.part)}成衣尺寸" ${dis}></td><td style="padding:4px"><input type="number" step="0.1" inputmode="decimal" data-input="row" data-field="${idx}:correction" value="${E(r.correction)}" placeholder="±" aria-label="${E(r.part)}修正" ${dis}></td></tr>`).join('')}</tbody></table>${!state.submitted?`<div class="row" style="margin-top:10px">${b('＋ 增加部位','add-row','A-MEAS-ADDROW','class="link"')}${b('填入本件示例尺寸','measure-example','','class="link"')}</div>${peers.length?b(`同步到 ${peers.map(itemName).join('、')}`,'sync-rows','A-MEAS-SYNC','class="full"'):''}${state.syncUndo?b('撤销同步','undo-sync','','class="link"'):''}`:''}<p class="muted" style="margin-top:8px">净尺寸必填且大于 0；成衣尺寸可空；修正可填负数；自定义行填了部位名就必须填净尺寸。</p></section><section class="card"><div class="section-label"><h3>③ 本件备注</h3>${mark('C-MEAS-ITEM-REMARK')}</div><textarea data-input="meas-remark" aria-label="本件备注" placeholder="只记在${itemName(i)}这件上，可空" ${dis}>${E(i.measRemark)}</textarea></section>`;}

const SCREENS=[renderHome,renderAppointments,renderNeeds,renderCategories,renderItems,renderReview,renderCart,renderPayment,renderContract,renderMeasure];
function screenHTML(){const g=guide();return `<div class="heading"><div><p class="eyebrow">${state.screen>=3&&state.screen<=5?'定制下单':'门店接待'} / S${state.screen}</p><h1>${TITLES[state.screen]}</h1></div><span class="pill ${state.items.some(i=>tbdCount(i))?'warn':''}">${state.screen<3?'顾问小周':state.story==='C'?'试穿老师小美':statusLabel()}</span></div>${fiveQuestions()}<div class="guide"><strong>剧本 ${state.story} · ${STORIES[state.story][0]}</strong>${g.text}</div>${SCREENS[state.screen]()}${removed(state.screen)}`;}
function dockHTML(){if(state.screen===0)return '';const a=mainAction();return `<div class="dock"><div class="dock-inner">${a.issue?state.screen===7&&state.paymentView==='customer'?'<p class="muted">请由店员核对付款信息后继续</p>':b(E(a.issue.label),'jump','','class="reason"'):''}<button class="primary" data-action="${a.action}" ${state.modal?'':'data-primary-action'} ${a.issue?'disabled':''}>${E(a.label)} ${mark(a.id)}</button>${state.screen===6&&cartStatus()==='draft'?b('先量体，稍后付款','to-measure','A-CART-02','class="secondary"'):state.screen===9&&state.measureStage==='items'&&!state.submitted?b('返回订单信息','back-order-info','','class="secondary"'):state.screen>1?b('返回客户首页','home','','class="secondary"'):''}</div></div>`;}
function modalHTML(){if(!state.modal)return '';let content='';switch(state.modal){case 'stories':content=`<h2>选择一个剧本</h2><p class="muted">选择即恢复该剧本起点，替换当前 Demo 状态。</p>${Object.entries(STORIES).map(([k,[title,desc]])=>b(`<strong>${k} · ${title}</strong><small>${desc}</small>`,'story','',`class="story-card" data-value="${k}"`)).join('')}`;break;case 'sync-confirm':content=`<h2>同步前确认</h2><p>以下件已有尺寸，将被本件已填的格覆盖（空格不覆盖，备注不同步）：</p>${state.syncConflicts.map(c=>`<p><strong>${E(c.name)}</strong>：${c.n} 项将被改写</p>`).join('')}<button class="primary" data-primary-action data-action="sync-rows" data-confirmed="1">确认同步</button><p class="muted">同步后可点「撤销同步」。</p>`;break;case 'convert-legacy':content='<h2>转为 v2 编辑</h2><p>确认后将旧工艺转为 v2 编辑，未知旧值显示为「其他：&lt;旧值&gt;」，原始记录仍保留。</p>'+b('确认转为 v2 编辑','convert-legacy','','class="primary"');break;case 'history':content=`<h2>历史方案 · 只读</h2>${state.history.map((items,n)=>`<section class="card"><h3>历史 ${n+1} · ${items.length} 件</h3>${items.map(i=>`<p>${NAMES[i.garmentType]} · ${i.fabric?.fabric_code||'未选'}</p>`).join('')}</section>`).join('')}`;break;case 'order':content=`<h2>${state.submitted?'订单已生成':'本单核对'}</h2><p class="success-box">STO-DEMO-0919 · ${statusLabel()}</p><div class="stack" style="margin-top:16px">${state.items.map((i,n)=>`<p>${n+1}. ${itemName(i)} · ${i.fabric?.fabric_code||'未选'} · ${state.submitted?'生产待接收':tbdCount(i)?'待定未落定':'已记录'}</p>`).join('')}</div><p class="muted" style="margin-top:15px">这是本机 Demo 状态，没有发送真实生产指令。</p>`;break;case 'member':content='<h2>会员服务</h2><p>开卡 / 充值为次要入口，完成后返回本次付款。</p>'+b('模拟完成并返回付款','activate-wallet','','class="full"');break;case 'pdf':content='<h2>合同副本</h2><p>本单 STO-DEMO-0919 · 客户 '+E(state.customer?.name||'未登记')+'</p><p class="muted">离线预览示例；正式版此处提供 PDF 查看、下载、发送。</p>';break;case 'edit-contract':content='<h2>合同已转为待重签</h2><p>修改后需由客户重新签署，原签名已失效。</p>';break;case 'legacy':content='<h2>历史工艺原文</h2><pre style="white-space:pre-wrap;font-size:12px">'+E(JSON.stringify(state.items[0]?.legacyDetails||{},null,2))+'</pre>';break;case 'invite':content='<h2>预约邀请</h2><p>王先生 · 今日 14:00 · 国贸店</p><p class="muted">离线邀请预览，不发送消息。</p>';break;case 'new-customer':content='<h2>新客建档</h2><p>本次接待可先沟通需求，姓名电话在量体页（或付款页）补。</p>'+b('未预约 · 开始接待','walkin');break;case 'production-board':content='<h2>生产看板</h2><p>'+ (state.submitted?'STO-DEMO-0919 · 等待生产接收':'今天还没有本次 Demo 提交的订单')+'</p>';break;case 'referral':content='<h2>转介绍登记</h2><p class="muted">保留的次要入口；本 Demo 演示定制下单主链。</p>';break;}
return `<div class="overlay" role="dialog" aria-modal="true" aria-label="操作面板"><section class="modal"><div class="row" style="justify-content:flex-end">${b('关闭','close','','aria-label="关闭弹窗"')}</div>${content}</section></div>`;}
let observer=null;
function render(){if(typeof document==='undefined')return;const focused=document.activeElement,restore=focused?.dataset?.input?{kind:focused.dataset.input,field:focused.dataset.field,start:focused.selectionStart,end:focused.selectionEnd}:null;document.getElementById('app').innerHTML=screenHTML();document.getElementById('dock').innerHTML=dockHTML();document.getElementById('overlay').innerHTML=modalHTML();document.getElementById('story-key').textContent=state.story;document.getElementById('journey').innerHTML=TITLES.map((t,n)=>b(`S${n} ${t}`,'nav','',`data-value="${n}" class="${n===state.screen?'current':''}"`)).join('');const cue=guide().target;document.querySelectorAll('[data-action], [data-input]').forEach(el=>{if(el.dataset.action===cue||el.dataset.cue===cue||el.querySelector(`[data-contract-id="${cue}"]`))el.classList.add('next-cue');});if(cue==='A-FAB-01')document.getElementById('fabric-query')?.classList.add('next-cue');if(cue&&!document.querySelector('.next-cue')){const ce=document.querySelector(`[data-contract-id="${cue}"]`);const host=ce?(ce.closest('button,label,.group,section')||ce):null;host?.classList.add('next-cue');}if(restore){const el=[...document.querySelectorAll('[data-input]')].find(e=>e.dataset.input===restore.kind&&e.dataset.field===restore.field);if(el){el.focus({preventScroll:true});if(restore.start!==null&&['text','tel','textarea'].includes(el.type))el.setSelectionRange(restore.start,restore.end);}}if(observer)observer.disconnect();if(state.screen===5&&typeof IntersectionObserver!=='undefined'){observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible[0])document.getElementById('review-progress').textContent=Number(visible[0].target.dataset.reviewIndex)+1;},{rootMargin:'-10% 0px -50% 0px'});document.querySelectorAll('[data-review-index]').forEach(el=>observer.observe(el));}if(state.focus){const el=document.getElementById('field-'+state.focus)||document.getElementById(state.focus);el?.scrollIntoView({block:'center',behavior:'smooth'});el?.classList.add('focus-field');el?.querySelector('input')?.focus({preventScroll:true});}}
function updateInput(el){const k=el.dataset.input,f=el.dataset.field,v=el.value,i=currentItem();switch(k){case 'home-search':state.search=v;break;case 'appointment-search':state.apSearch=v;break;case 'date':state.date=v===new Date().toLocaleDateString('en-CA')?'今日':v;break;case 'need-remark':state.needs.remark=v;break;case 'fabric-query':i.query=v;i.fabric=null;break;case 'craft-text':i.craft[f]=v;break;case 'craft-note':i.notes[f]=v;break;case 'hem-cm':i.hemCm=v;break;case 'emb':i.emb[f]=v;break;case 'item-remark':i.remark=v;break;case 'payment':state.payments[f].amount=v;state.approved=false;break;case 'transaction':state.payments[f].transaction=v;break;case 'collar-len':i.collarLen=v;break;case 'order':state.order[f]=v;break;case 'row':{const [idx,key]=f.split(':');const r=ensureRows(i)[Number(idx)];if(r&&!state.submitted){r[key]=v;state.measured=false;}break;}case 'pattern-custom':i.patternCustom=v;break;case 'meas-remark':i.measRemark=v;break;}render();}
if(typeof document!=='undefined'){
 document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const before=state.screen;act(target.dataset.action,target.dataset);render();if(before!==state.screen&&!state.focus)window.scrollTo({top:0,behavior:'instant'});});
 document.addEventListener('input',event=>{if(event.target.dataset.input)updateInput(event.target);});
 document.addEventListener('change',event=>{const el=event.target;if(!el.dataset.upload||!el.files?.length||state.submitted)return;if(state.uploadFail){state.notice='图片添加失败，可重试；尺寸仍可保存。';render();return;}const files=[...el.files];if(el.dataset.upload==='order'){files.forEach(f=>state.order.attachments.push(f.name));render();return;}const item=currentItem();let pending=files.filter(f=>f.type.startsWith('image/')).length;if(!pending){state.notice='图片添加失败，请选择图片；尺寸仍可保存。';render();return;}files.forEach(file=>{if(!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{if(!state.submitted)item.photos.push({name:file.name,src:reader.result});if(--pending<=0){state.notice='本件图片已保存在当前 Demo。';render();}};reader.onerror=()=>{if(--pending<=0){state.notice='图片添加失败，可重试；尺寸仍可保存。';render();}};reader.readAsDataURL(file);});});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal=null;render();}if(event.key==='Enter'&&event.target.dataset.input==='fabric-query'){event.preventDefault();render();}});
 render();
}

globalThis.Demo={get state(){return state;},reset,act,render,screenHTML,dockHTML,modalHTML,mainAction,cartStatus,firstIssue,measureIssue,paymentTotal,paymentIssue,CATALOG,FABRICS,fixture,fillMeasurements};
